name: Temporary ICP voting validation
on:
  push:
    branches: [icp-app-voting, main]
    paths: ['web/**', 'config/**', 'icp/**', '.github/workflows/temporary-voting-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    if: github.ref_name == 'icp-app-voting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build:backend
      - name: Verify stable compatibility and upgrade from the previous backend
        run: |
          git show bbd0b6561280be26fd73ef34a14e87febc5d770d:icp/backend/main.mo > .icp-build/pre-vote.mo
          cp icp/backend/Avatar.mo .icp-build/Avatar.mo
          .icp-tools/compiler/moc --package base .icp-tools/base/src -c --stable-types -o .icp-build/pre-vote.wasm .icp-build/pre-vote.mo
          .icp-tools/compiler/moc --stable-compatible .icp-build/pre-vote.most .icp-build/backend.most
          PREVIOUS_BACKEND_WASM=.icp-build/pre-vote.wasm npm run test:icp
      - run: npm run build:icp
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node config/personal-dashboard-browser.mjs
      - run: node config/admin-mode-browser.mjs
      - run: node config/admin-ui-browser.mjs
      - run: node config/infrastructure-browser.mjs
  cleanup:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch='icp-app-voting';
            const review=await github.rest.git.getRef({...context.repo,ref:'heads/'+branch});
            const main=await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            const result=await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:review.data.object.sha+'...'+main.data.object.sha});
            if(!['ahead','identical'].includes(result.data.status))throw Error('Review branch not included in main');
            await github.rest.git.deleteRef({...context.repo,ref:'heads/'+branch});
