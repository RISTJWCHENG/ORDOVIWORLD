name: Ordosyn Monitor
run-name: ORDOSYN Cloud v1 native safety and real discovery review

on:
  push:
    branches: [core17-staging-safe]
    paths:
      - '.github/workflows/ordosyn-monitor.yml'
      - '.github/workflows/ordosyn-cloud-v1-*.yml'
      - 'ordosyn-core/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordosyn-monitor-native-staging
  cancel-in-progress: false

jobs:
  native-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Cloud v1 and Core tests
        run: |
          node --test ordosyn-core/cloud-v1/*.test.mjs
          node --test ordosyn-core/tests/*.test.mjs
      - name: Website tests and build
        run: |
          npm ci
          npm test
          npm run build
  real-discovery-readonly:
    needs: native-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real GitHub discovery (no cloud writes)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ordosyn-review"
          node ordosyn-core/discovery/run.mjs --sources github --strict --out "$RUNNER_TEMP/ordosyn-review/candidates.json"
      - name: Robots-aware public crawl (max 3)
        run: |
          node ordosyn-core/crawl/prepare.mjs --in "$RUNNER_TEMP/ordosyn-review/candidates.json" --out "$RUNNER_TEMP/ordosyn-review/batch.json" --max 3 --scan 12
      - name: Verify real discovery evidence, never checkpoint
        run: |
          node ordosyn-core/cloud-v1/real-discovery-proof.mjs "$RUNNER_TEMP/ordosyn-review/candidates.json" "$RUNNER_TEMP/ordosyn-review/batch.json"
      - name: Upload discovery review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordosyn-native-discovery-review
          path: ${{ runner.temp }}/ordosyn-review/*.json
          if-no-files-found: ignore
          retention-days: 3
