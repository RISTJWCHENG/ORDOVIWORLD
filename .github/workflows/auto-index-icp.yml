name: ICP auto-index V2 (strict SNS)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Live project discovery
        run: mkdir -p data && npm run crawl
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Evaluate strict trust rules and generate D1 SQL
        run: node crawler/auto-index.mjs
      - name: Upload decision report and SQL
        uses: actions/upload-artifact@v4
        with:
          name: icp-auto-index-${{ github.run_id }}
          path: |
            data/projects.json
            data/auto-index-report.json
            data/auto-index.sql
          retention-days: 14
      - name: Sync approved source records to D1 (opt-in)
        if: ${{ vars.ORDOVIWORLD_AUTO_PUBLISH == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare API token'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Cloudflare account ID'; exit 1; }
          npx wrangler d1 execute ordoviworld-db --remote --config worker/wrangler.jsonc --file=data/auto-index.sql
